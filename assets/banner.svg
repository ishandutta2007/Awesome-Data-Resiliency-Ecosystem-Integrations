<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2387"/>
      <stop offset="50%" stop-color="#e94057"/>
      <stop offset="100%" stop-color="#f27121"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.45"/>
    </pattern>

    <!-- Keyframe Styles -->
    <style>
      .pulse-slow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .pulse-fast {
        animation: pulse 2.5s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8, 12;
        animation: dash 20s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6, 10;
        animation: dash-reverse 16s linear infinite;
      }
      .orbit-node {
        animation: float 6s ease-in-out infinite alternate;
      }
      .orbit-node-2 {
        animation: float-alt 5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.65; }
        100% { transform: scale(1.02); opacity: 0.95; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes dash-reverse {
        to { stroke-dashoffset: 400; }
      }
      @keyframes float {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
        100% { transform: translateY(6px) translateX(-5px); }
      }
      @keyframes float-alt {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(7px) translateX(-6px); }
        100% { transform: translateY(-7px) translateX(4px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Ambient Animated Glowing Orbs in Background -->
  <circle cx="150" cy="100" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow-cyan)" class="pulse-slow" />
  <circle cx="1050" cy="300" r="170" fill="#7928ca" opacity="0.15" filter="url(#glow-purple)" class="pulse-fast" />
  <circle cx="950" cy="90" r="110" fill="#00f2fe" opacity="0.08" filter="url(#glow-cyan)" class="pulse-slow" />

  <!-- Animated Dynamic Circuit & Resilience Streams (Background) -->
  <g opacity="0.4">
    <path class="flow-line" d="M 50 80 Q 250 160 450 110 T 850 130 T 1150 90" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <path class="flow-line-reverse" d="M 50 320 Q 300 240 600 290 T 950 250 T 1150 330" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <path class="flow-line" d="M 100 200 C 300 120 400 280 700 200 S 1000 140 1120 220" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Dynamic Network Floating Ecosystem Nodes (Background/Edges) -->
  <g class="orbit-node">
    <circle cx="110" cy="240" r="28" fill="url(#card-grad)" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <text x="110" y="244" fill="#00f2fe" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">CLOUD</text>
  </g>
  <g class="orbit-node-2">
    <circle cx="1080" cy="160" r="32" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5" filter="url(#glow-purple)"/>
    <text x="1080" y="164" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">BACKUP</text>
  </g>
  <g class="orbit-node">
    <circle cx="1020" cy="270" r="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="1020" y="274" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">iPaaS</text>
  </g>

  <!-- Foreground Shield / Resilience Emblem (Centered Top Behind Title) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Outer Shield Halo -->
    <circle cx="0" cy="0" r="42" fill="#00f2fe" opacity="0.15" filter="url(#glow-cyan)" class="pulse-slow"/>
    <!-- Cyber Shield Geometry -->
    <path d="M 0 -26 L 24 -12 L 24 10 C 24 24 0 34 0 34 C 0 34 -24 24 -24 10 L -24 -12 Z" 
          fill="url(#card-grad)" stroke="url(#cyber-cyan)" stroke-width="2.5"/>
    <!-- Resilience Core Pulse -->
    <path d="M -9 2 L -2 9 L 10 -4" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND HERO TYPOGRAPHY (High Contrast, Guaranteed Clarity) -->
  <!-- Main Title -->
  <text class="title-text" x="600" y="160" text-anchor="middle" fill="#ffffff" font-size="38" letter-spacing="-0.5">
    DATA RESILIENCY ECOSYSTEM
  </text>
  
  <text class="title-text" x="600" y="202" text-anchor="middle" fill="url(#cyber-cyan)" font-size="28" letter-spacing="1.5">
    &amp; INTEGRATIONS
  </text>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="245" text-anchor="middle" fill="#94a3b8" font-size="16">
    Curated SaaS Marketplaces, Orchestration Pipelines &amp; Open-Source Connectors
  </text>

  <!-- FOREGROUND FEATURE PILLS -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <!-- Pill 1: Backup Orchestration -->
    <g transform="translate(-320, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="-75" cy="0" r="4" fill="#38bdf8"/>
      <text class="pill-text" x="5" y="5" fill="#e2e8f0" text-anchor="middle">⚡ Backup Orchestration</text>
    </g>

    <!-- Pill 2: Cyber Disaster Recovery -->
    <g transform="translate(-105, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.95"/>
      <circle cx="-75" cy="0" r="4" fill="#a855f7"/>
      <text class="pill-text" x="5" y="5" fill="#e2e8f0" text-anchor="middle">🛡️ Disaster Recovery</text>
    </g>

    <!-- Pill 3: SaaS Marketplaces -->
    <g transform="translate(105, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1e293b" stroke="#00f2fe" stroke-width="1.2" opacity="0.95"/>
      <circle cx="-72" cy="0" r="4" fill="#00f2fe"/>
      <text class="pill-text" x="5" y="5" fill="#e2e8f0" text-anchor="middle">🌐 Cloud Marketplaces</text>
    </g>

    <!-- Pill 4: Open-Source iPaaS -->
    <g transform="translate(315, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
      <circle cx="-75" cy="0" r="4" fill="#10b981"/>
      <text class="pill-text" x="5" y="5" fill="#e2e8f0" text-anchor="middle">🔓 Open-Source iPaaS</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="0" y="0" width="1200" height="400" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="398" x2="1200" y2="398" stroke="url(#cyber-cyan)" stroke-width="3" opacity="0.8"/>
</svg>
